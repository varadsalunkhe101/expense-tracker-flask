<!DOCTYPE html>
<html>
<head>
    <title>View Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">

    <style>
        body{
            background: url("/static/images/i3.jpeg") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .table-card{
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h3{
            text-align: center;
            font-weight: bold;
            color: #212529;
            margin-bottom: 25px;
        }

        .table{
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <div class="table-card">

        <h3>All Expenses</h3>

        <div class="table-responsive">

            <table class="table table-bordered table-hover text-center align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Amount</th>
                        <th>Reason</th>
                        <th>Date</th>
                        <th>Time</th>
                    </tr>
                </thead>

                <tbody>
                    {% for expense in expenses %}
                    <tr>
                        <td>{{ expense[0] }}</td>
                        <td>₹{{ expense[1] }}</td>
                        <td>{{ expense[2] }}</td>
                        <td>{{ expense[3] }}</td>
                        <td>{{ expense[4] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>

        <div class="text-center mt-4">
            <a href="/dashboard" class="btn btn-secondary px-4">
                Back to Dashboard
            </a>
        </div>

    </div>

</div>

</body>
</html>
